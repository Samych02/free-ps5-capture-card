name: FreePS5CaptureCard
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    ARCHS: arm64
targets:
  FreePS5CaptureCard:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.freeps5capturecard.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Free PS5 Capture Card
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Find and connect to your PS5 for capture in OBS.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - framework: build/native/$(CONFIGURATION)/frameworks/CaptureEngine.framework
        embed: true
        codeSign: true
  FreePS5CaptureCardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.freeps5capturecard.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FreePS5CaptureCard
      - framework: build/native/$(CONFIGURATION)/frameworks/CaptureEngine.framework
        embed: false
  FreePS5CaptureCardUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.freeps5capturecard.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FreePS5CaptureCard
schemes:
  FreePS5CaptureCard:
    build:
      targets:
        FreePS5CaptureCard: all
    test:
      targets: [FreePS5CaptureCardTests, FreePS5CaptureCardUITests]
